    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: #69BE94; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }

    .walker-cta:hover { text-decoration: underline; }
    .app-badge { display: inline-block; text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 999px; transition: background 0.2s; }
    .app-badge.active { background: #111; color: #fff; }
    .app-badge.active:hover { background: #333; }
    .app-badge.coming-soon { background: #f0f0f0; color: #888; }
    .footer-links { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
    .footer-links a { font-size: 11px; color: #aaa; text-decoration: none; white-space: nowrap; }
    .footer-links a:hover { color: #69BE94; }
